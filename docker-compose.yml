services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: storages_app
    restart: unless-stopped
    volumes:
      - .:/var/www
    networks:
      - storages_network
    depends_on:
      mysql:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: storages_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - storages_network
    depends_on:
      - app

  mysql:
    image: mysql:9
    container_name: storages_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_EXTERNAL_PORT:-3307}:${DB_PORT:-3306}"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - storages_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u${DB_USERNAME}", "-p${DB_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  storages_network:
    driver: bridge

volumes:
  mysql_data:
